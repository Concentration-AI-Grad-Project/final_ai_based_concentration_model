{% extends "base.html" %}
{% block title %}{{ lecture.title }} 시청{% endblock %}
{% block head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/socket.io@4.6.1/client-dist/socket.io.min.js"></script>
{% endblock %}

{% block content %}
<div class="watch-layout">

  <!-- 좌측: 영상 + 웹캠 -->
  <div class="watch-left">
    <h2 class="lecture-title">{{ lecture.title }}</h2>

    <video id="lecture-video" controls class="lecture-video"
           src="{{ url_for('uploaded_file', filename=lecture.filename) }}">
    </video>

    <div class="webcam-section">
      <div class="webcam-header">
        <span>웹캠</span>
        <span id="cam-status" class="status-dot off">●</span>
        <button id="btn-cam" class="btn-outline btn-sm" onclick="toggleCam()">카메라 켜기</button>
      </div>
      <video id="webcam" autoplay muted playsinline class="webcam-preview"></video>
      <canvas id="snap" style="display:none"></canvas>
    </div>
  </div>

  <!-- 우측: 집중도 패널 -->
  <div class="watch-right">
    <div class="score-panel">
      <div class="score-label">현재 집중도</div>
      <div class="score-ring">
        <svg viewBox="0 0 120 120" width="120" height="120">
          <circle cx="60" cy="60" r="50" fill="none" stroke="#dcedc8" stroke-width="10"/>
          <circle id="ring" cx="60" cy="60" r="50" fill="none"
                  stroke="#8bc34a" stroke-width="10"
                  stroke-dasharray="314" stroke-dashoffset="314"
                  stroke-linecap="round"
                  transform="rotate(-90 60 60)"/>
        </svg>
        <div class="score-num" id="score-num">—</div>
      </div>
      <div id="score-level" class="score-level">-</div>
    </div>

    <div class="chart-panel">
      <div class="chart-title">집중도 추이</div>
      <canvas id="realtime-chart" height="160"></canvas>
    </div>

    <!-- 데이터 수집 모드 (ML 학습용) -->
    <div class="collect-panel">
      <div class="collect-title">📊 학습 데이터 수집</div>
      <p class="collect-desc">버튼을 눌러 현재 상태를 레이블링합니다.</p>
      <div class="collect-buttons">
        <button class="btn-collect focused"    onclick="collectSample(1)">✅ 집중 중</button>
        <button class="btn-collect unfocused"  onclick="collectSample(0)">❌ 비집중</button>
      </div>
      <div id="collect-msg" class="collect-msg"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const VIEW_ID   = {{ view_id }};
const socket    = io();
let   streaming = false;
let   camStream = null;
let   startTime = null;
let   frameInt  = null;
const INTERVAL  = 3000;   // ms — 프레임 전송 간격

// ── 실시간 차트 초기화 ──────────────────────────────────────────────────
const rtCtx   = document.getElementById('realtime-chart').getContext('2d');
const rtChart = new Chart(rtCtx, {
  type: 'line',
  data: {
    labels: [],
    datasets: [{
      label: '집중도',
      data: [],
      borderColor: '#8bc34a',
      backgroundColor: 'rgba(139,195,74,0.15)',
      tension: 0.4,
      fill: true,
      pointRadius: 3,
    }]
  },
  options: {
    animation: { duration: 300 },
    scales: {
      y: { min: 0, max: 100, ticks: { callback: v => v + '%' } },
      x: { ticks: { maxTicksLimit: 10 } }
    },
    plugins: { legend: { display: false } }
  }
});

function pushChart(ts, score) {
  const label = ts + 's';
  rtChart.data.labels.push(label);
  rtChart.data.datasets[0].data.push((score * 100).toFixed(1));
  if (rtChart.data.labels.length > 60) {
    rtChart.data.labels.shift();
    rtChart.data.datasets[0].data.shift();
  }
  rtChart.update('none');
}

// ── 점수 UI 갱신 ────────────────────────────────────────────────────────
function updateScoreUI(score) {
  const pct    = Math.round(score * 100);
  const offset = 314 - (314 * score);
  document.getElementById('ring').style.strokeDashoffset = offset;
  document.getElementById('score-num').textContent = pct + '%';

  const ring  = document.getElementById('ring');
  const level = document.getElementById('score-level');
  if (score >= 0.7) {
    ring.style.stroke = '#66bb6a'; level.textContent = '집중'; level.className = 'score-level high';
  } else if (score >= 0.4) {
    ring.style.stroke = '#ffb74d'; level.textContent = '보통'; level.className = 'score-level mid';
  } else {
    ring.style.stroke = '#ef5350'; level.textContent = '집중 낮음'; level.className = 'score-level low';
  }
}

// ── 카메라 토글 ──────────────────────────────────────────────────────────
async function toggleCam() {
  if (!streaming) {
    try {
      camStream = await navigator.mediaDevices.getUserMedia({ video: true });
      document.getElementById('webcam').srcObject = camStream;
      document.getElementById('cam-status').className = 'status-dot on';
      document.getElementById('btn-cam').textContent  = '카메라 끄기';
      startTime = Date.now();
      streaming = true;
      frameInt  = setInterval(sendFrame, INTERVAL);
    } catch(e) {
      alert('카메라 접근 실패: ' + e.message);
    }
  } else {
    clearInterval(frameInt);
    camStream.getTracks().forEach(t => t.stop());
    document.getElementById('webcam').srcObject = null;
    document.getElementById('cam-status').className = 'status-dot off';
    document.getElementById('btn-cam').textContent  = '카메라 켜기';
    streaming = false;
  }
}

// ── 프레임 전송 ──────────────────────────────────────────────────────────
function sendFrame() {
  const video  = document.getElementById('webcam');
  const canvas = document.getElementById('snap');
  canvas.width  = 320;
  canvas.height = 240;
  canvas.getContext('2d').drawImage(video, 0, 0, 320, 240);
  const image = canvas.toDataURL('image/jpeg', 0.7);
  const ts    = Math.floor((Date.now() - startTime) / 1000);
  socket.emit('frame', { view_id: VIEW_ID, timestamp: ts, image });
}

// ── 서버 응답 수신 ──────────────────────────────────────────────────────
socket.on('frame_result', ({ timestamp, score }) => {
  updateScoreUI(score);
  pushChart(timestamp, score);
});

// ── 데이터 수집 ─────────────────────────────────────────────────────────
function collectSample(label) {
  if (!streaming) { alert('카메라를 먼저 켜주세요.'); return; }
  const video  = document.getElementById('webcam');
  const canvas = document.getElementById('snap');
  canvas.width  = 320;
  canvas.height = 240;
  canvas.getContext('2d').drawImage(video, 0, 0, 320, 240);
  socket.emit('collect_sample', {
    image: canvas.toDataURL('image/jpeg', 0.8),
    label
  });
}

socket.on('collect_result', ({ ok, reason }) => {
  const el = document.getElementById('collect-msg');
  el.textContent = ok ? '✅ 저장되었습니다.' : '⚠️ 저장 실패: ' + reason;
  setTimeout(() => { el.textContent = ''; }, 2000);
});

// ── 페이지 이탈 시 정리 ─────────────────────────────────────────────────
window.addEventListener('beforeunload', () => {
  if (camStream) camStream.getTracks().forEach(t => t.stop());
});
</script>
{% endblock %}
