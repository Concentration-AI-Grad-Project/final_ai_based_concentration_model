{% extends "base.html" %}
{% block title %}강의 업로드 — Focus{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-aside">
    <div class="auth-aside__num">— / Upload</div>
    <h2>새 강의를<br/>업로드하세요.</h2>
    <p class="quote">
      "업로드한 강의는 학생들에게 즉시 노출되며,
      시청과 동시에 집중도 데이터가 수집되기 시작합니다."
    </p>
  </div>

  <div class="auth-box">
    <h2>강의 업로드</h2>
    <p class="auth-sub">동영상 파일을 선택해 주세요.</p>
    <form method="post" enctype="multipart/form-data">
      <label>강의 제목</label>
      <input type="text" name="title" placeholder="강의 제목 (미입력 시 파일명 사용)"/>
      <label>동영상 파일</label>
      <input type="file" name="file" accept="video/*" required/>
      <button type="submit" class="btn-primary">업로드</button>
    </form>
    <p class="auth-link"><a href="{{ url_for('professor') }}">← 대시보드로 돌아가기</a></p>
  </div>
</div>
{% endblock %}
