{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
<div class="auth-box">
  <h2>로그인</h2>
  <form method="post">
    <label>아이디</label>
    <input type="text" name="username" required autofocus/>
    <label>비밀번호</label>
    <input type="password" name="password" required/>
    <button type="submit" class="btn-primary">로그인</button>
  </form>
  <p class="auth-link">계정이 없으신가요? <a href="{{ url_for('register') }}">회원가입</a></p>
  <div class="hint-box">
    <strong>기본 계정</strong><br>
    교수자: prof1 / pass<br>
    학생: student1 / pass
  </div>
</div>
{% endblock %}
