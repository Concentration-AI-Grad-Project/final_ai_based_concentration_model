{% extends "base.html" %}
{% block title %}로그인 — Focus{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-aside">
    <div class="auth-aside__num">01 / Sign In</div>
    <h2>집중을<br/>측정하다.</h2>
    <p class="quote">
      "Focus는 비대면 학습 환경에서 학습자의 집중 상태를 데이터로 가시화합니다.
      더 나은 강의, 더 나은 학습을 위한 가장 단순한 도구."
    </p>
  </div>

  <div class="auth-box">
    <h2>로그인</h2>
    <p class="auth-sub">계정 정보를 입력해 주세요.</p>
    <form method="post">
      <label>아이디</label>
      <input type="text" name="username" placeholder="아이디" required autofocus/>
      <label>비밀번호</label>
      <input type="password" name="password" placeholder="비밀번호" required/>
      <button type="submit" class="btn-primary">로그인</button>
    </form>
    <p class="auth-link">계정이 없으신가요? <a href="{{ url_for('register') }}">회원가입</a></p>
    <div class="hint-box">
      <strong>테스트 계정</strong><br>
      교수자: prof1 / pass<br>
      학생: student1 / pass
    </div>
  </div>
</div>
{% endblock %}
